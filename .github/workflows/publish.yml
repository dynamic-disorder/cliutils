# Publishes this package through Trusted Publishing: the job exchanges a short-lived GitHub OIDC
# token for a temporary nuget.org API key, so no long-lived secret exists anywhere. Register the
# matching policy on nuget.org first - see PUBLISHING.md.
#
# Runs only when a version tag is pushed:
#   git tag v0.1.0 && git push origin v0.1.0

name: publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write   # required: lets this job request the OIDC token nuget.org validates

jobs:
  publish:
    runs-on: ubuntu-latest
    # Must match the Environment field of the nuget.org trusted-publishing policy, or the OIDC
    # token will not match the policy. An environment also lets you require approval here.
    environment: production
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v4

      - name: Set up the .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Take the version from the tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Pack
        run: dotnet pack -c Release -p:Version=${{ steps.version.outputs.value }} -o artifacts

      - name: Exchange the OIDC token for a temporary API key
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}   # the nuget.org profile name, not the email address

      - name: Push the package and its symbols
        env:
          PACKAGE: DynamicDisorder.CliUtils.${{ steps.version.outputs.value }}
        run: |
          # Name both artifacts explicitly. A "*.nupkg" glob also matches the ".snupkg" beside it:
          # the first release pushed the symbols twice and logged a spurious conflict.
          dotnet nuget push "artifacts/$PACKAGE.nupkg" \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json --skip-duplicate
          dotnet nuget push "artifacts/$PACKAGE.snupkg" \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json --skip-duplicate
